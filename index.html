<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گات‌ها | تاریخ ایران باستان</title>

<style>
body{
margin:0;
background:#080808;
color:white;
font-family:tahoma;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9));
text-align:center;
padding:20px;
}

h1{
font-size:55px;
color:#d4af37;
margin:0;
}

p{
font-size:20px;
color:#ddd;
max-width:700px;
line-height:2;
}

.button{
margin-top:35px;
padding:18px 40px;
background:#d4af37;
color:#111;
text-decoration:none;
border-radius:40px;
font-size:20px;
font-weight:bold;
transition:.3s;
}

.button:hover{
background:white;
}

.menu{
padding:60px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
background:#111;
}

.card{
background:#1a1a1a;
padding:30px;
border-radius:18px;
text-align:center;
font-size:22px;
border:1px solid #d4af37;
}
</style>

</head>

<body>

<section class="hero">

<h1>گات‌ها</h1>

<p>
سفری به اعماق تاریخ ایران...
از زرتشت و گات‌ها تا کوروش بزرگ، هخامنشیان و تمدن‌هایی که جهان را تغییر دادند.
</p>

<a href="#menu" class="button">شروع سفر</a>

</section>

<section class="menu" id="menu">

<div class="card">گات‌ها</div>

<div class="card">زرتشت</div>

<div class="card">کوروش بزرگ</div>

<div class="card">شاهنشاهی هخامنشی</div>

<div class="card">تاریخ ایران باستان</div>

<div class="card">آیین زرتشت</div>

<div class="card">تمدن‌های پیش از هخامنشی</div>

<div class="card">مقالات تاریخی</div>

</section>

</body>
</html>
